spring.application.name=JpaDemo

# URL de conexion a Postgresql
spring.datasource.url= jdbc:postgresql://localhost:5432/jpaDemo

#usuario de la base de datos: postgres
spring.datasource.username=postgres

spring.datasource.password=admin123

spring.jpa.show-sql=true

# none = no toca el esquema (valor por defecto con PostgreSQL)
# update = crea/actualiza tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update